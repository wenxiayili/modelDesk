name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend source
        run: node scripts/check-frontend.js

      - name: Prepare Tauri frontend assets
        run: node scripts/prepare-tauri-dist.js

      - name: Check built frontend source
        run: node scripts/check-frontend.js dist

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Generate release notes from git messages
        shell: pwsh
        run: |
          $previousTag = git describe --tags --abbrev=0 "$env:RELEASE_TAG^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $previousTag) {
            $range = "$previousTag..$env:RELEASE_TAG"
          } else {
            $range = $env:RELEASE_TAG
          }

          $messages = git log $range --pretty=format:"- %h %s"
          if (-not $messages) {
            $messages = @("- No commits found for $env:RELEASE_TAG")
          }

          $body = @(
            "## Git messages",
            "",
            $messages,
            "",
            "## Windows installers",
            "",
            "Windows installers are attached below.",
            "",
            "This release is unsigned. Windows may show a SmartScreen warning on first launch."
          )

          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_BODY<<MODEL_DESK_RELEASE_BODY"
          Add-Content -Path $env:GITHUB_ENV -Value $body
          Add-Content -Path $env:GITHUB_ENV -Value "MODEL_DESK_RELEASE_BODY"

      - name: Build and draft GitHub Release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "ModelDesk ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ env.IS_PRERELEASE }}
