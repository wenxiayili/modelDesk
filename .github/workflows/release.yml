name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend source
        run: |
          node --check app.js
          node --check app/animations.mjs
          node --check app/constants.mjs
          node --check app/files.mjs
          node --check app/lighting.mjs
          node --check app/materials.mjs
          node --check app/measurements.mjs
          node --check app/resources.mjs
          node --check app/scene-meshes.mjs
          node --check app/scene-runtime.mjs
          node --check app/screenshot.mjs
          node --check app/status-hud.mjs
          node --check app/ui-controls.mjs
          node --check app/utils.mjs
          node --check app/view-controls.mjs
          node --check scripts/serve-static.js
          node --check scripts/prepare-tauri-dist.js

      - name: Prepare Tauri frontend assets
        run: node scripts/prepare-tauri-dist.js

      - name: Check built frontend source
        run: |
          node --check dist/app.js
          node --check dist/app/animations.mjs
          node --check dist/app/constants.mjs
          node --check dist/app/files.mjs
          node --check dist/app/lighting.mjs
          node --check dist/app/materials.mjs
          node --check dist/app/measurements.mjs
          node --check dist/app/resources.mjs
          node --check dist/app/scene-meshes.mjs
          node --check dist/app/scene-runtime.mjs
          node --check dist/app/screenshot.mjs
          node --check dist/app/status-hud.mjs
          node --check dist/app/ui-controls.mjs
          node --check dist/app/utils.mjs
          node --check dist/app/view-controls.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build and draft GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "ModelDesk ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Windows installers are attached below.

            This release is unsigned. Windows may show a SmartScreen warning on first launch.
          releaseDraft: true
          prerelease: ${{ env.IS_PRERELEASE }}
